<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Manage Attendants — Shift Reconciliation</title>
<style>
  :root {
    --bg: #12151D; --panel: #1B1F29; --panel-dark: #0D0F15; --border: #2A2F3C;
    --text: #F2F0EB; --muted: #8B92A0; --muted2: #6B7280;
    --shell-red: #ED1C24; --shell-yellow: #FDCC00; --teal: #4FB0C6; --green: #4FBE71;
    --input-bg: #1C2028; --input-border: #333A48;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 20px; padding-bottom: 60px;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .topbar h1 { font-size: 18px; margin: 0; }
  a.back { color: var(--muted); font-size: 12.5px; text-decoration: none; }
  .card { background: var(--panel-dark); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  .card h2 { font-size: 13px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
    border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 13.5px; margin-bottom: 10px;
  }
  button.primary {
    width: 100%; background: var(--shell-red); color: #fff; border: none; border-radius: 8px;
    padding: 11px; font-weight: 700; font-size: 13.5px; cursor: pointer;
  }
  .user-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border); gap: 8px; flex-wrap: wrap;
  }
  .user-row:last-child { border-bottom: none; }
  .user-row .name { font-size: 13.5px; font-weight: 600; }
  .user-row .email { font-size: 11.5px; color: var(--muted); }
  .user-row .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .status-pill { font-size: 10.5px; padding: 3px 8px; border-radius: 20px; font-weight: 700; }
  .status-active { background: rgba(79,190,113,0.15); color: var(--green); }
  .status-inactive { background: rgba(237,28,36,0.15); color: var(--shell-red); }
  .toggle-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer;
  }
  .toggle-btn.reset-btn { color: var(--teal); border-color: rgba(79,176,198,0.4); }
  .msg { font-size: 12.5px; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; display: none; word-break: break-word; }
  .msg.ok { background: rgba(79,190,113,0.12); color: var(--green); display: block; }
  .msg.err { background: rgba(237,28,36,0.12); color: #FF8A8F; display: block; }

  /* Temp password reveal modal */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; padding: 24px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    width: 100%; max-width: 360px; background: var(--panel-dark); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .modal h3 { margin: 0 0 6px; font-size: 15px; }
  .modal p { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); }
  .temp-pw {
    font-family: 'Courier New', monospace; font-size: 18px; letter-spacing: 1px;
    background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px;
    padding: 12px; text-align: center; margin-bottom: 14px; color: var(--shell-yellow);
  }
  .modal button { width: 100%; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Manage Attendants</h1>
  <a class="back" href="admin-dashboard.html">← Dashboard</a>
</div>

<div class="card">
  <h2>Invite new attendant</h2>
  <div class="msg" id="inviteMsg"></div>
  <input type="text" id="newName" placeholder="Full name" />
  <input type="email" id="newEmail" placeholder="Email address" />
  <input type="password" id="newPassword" placeholder="Temporary password" />
  <button class="primary" id="inviteBtn">Create account</button>
</div>

<div class="card">
  <h2>All attendants</h2>
  <div class="msg" id="listMsg"></div>
  <div id="userList"></div>
</div>

<div class="overlay" id="resetOverlay">
  <div class="modal">
    <h3>Reset password</h3>
    <p id="resetModalName"></p>
    <input type="text" id="resetPasswordInput" placeholder="New password (min 6 characters)" autocomplete="off" />
    <button class="toggle-btn" id="resetGenerateBtn" style="width:100%; margin-bottom:10px; padding:8px;">🎲 Generate random password</button>
    <div class="msg" id="resetModalMsg"></div>
    <div style="display:flex; gap:8px;">
      <button class="toggle-btn" id="resetModalCancel" style="flex:1; padding:11px;">Cancel</button>
      <button class="primary" id="resetModalConfirm" style="flex:1;">Set password</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=2"></script>
<script src="auth-guard.js"></script>
<script>
  let currentProfile = null;

  async function loadUsers() {
    const listMsg = document.getElementById('listMsg');
    listMsg.style.display = 'none';
    const listEl = document.getElementById('userList');

    try {
      const { data: users, error } = await sb.from('profiles').select('*').eq('role', 'attendant').order('full_name');

      if (error) {
        listMsg.textContent = `Could not load attendants: ${error.message}`;
        listMsg.className = 'msg err';
        return;
      }

      if (!users || users.length === 0) {
        listEl.innerHTML = '<p style="color:var(--muted2);font-size:13px;">No attendants yet — invite one above.</p>';
        return;
      }

      listEl.innerHTML = users.map((u) => `
        <div class="user-row">
          <div>
            <div class="name">${u.full_name}</div>
            <div class="email">${u.email}</div>
          </div>
          <div class="actions">
            <span class="status-pill ${u.active ? 'status-active' : 'status-inactive'}">${u.active ? 'Active' : 'Inactive'}</span>
            <button class="toggle-btn reset-btn" onclick="resetPassword('${u.id}', '${u.full_name.replace(/'/g, "\\'")}')">Reset Password</button>
            <button class="toggle-btn" onclick="toggleActive('${u.id}', ${u.active})">${u.active ? 'Deactivate' : 'Reactivate'}</button>
          </div>
        </div>
      `).join('');
    } catch (err) {
      console.error('Failed to load attendants:', err);
      listMsg.textContent = `Unexpected error: ${err.message || err}`;
      listMsg.className = 'msg err';
    }
  }

  async function toggleActive(id, currentlyActive) {
    try {
      await sb.from('profiles').update({ active: !currentlyActive }).eq('id', id);
      await logActivityLocal('attendant_status_changed', { target_id: id, active: !currentlyActive });
      loadUsers();
    } catch (err) {
      console.error('Failed to toggle status:', err);
      alert(`Could not update status: ${err.message || err}`);
    }
  }

  async function logActivityLocal(action, details) {
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      await sb.from('activity_logs').insert({ user_id: user.id, action, details });
    } catch (err) {
      console.error('Activity log failed (non-blocking):', err);
    }
  }

  function generateTempPassword() {
    // Avoids visually ambiguous characters (0/O, 1/l/I) since this gets read
    // aloud or copied down by hand at the station.
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
    let pw = '';
    for (let i = 0; i < 10; i++) pw += chars[Math.floor(Math.random() * chars.length)];
    return pw;
  }

  let resetTargetId = null;
  let resetTargetName = null;

  function resetPassword(id, name) {
    resetTargetId = id;
    resetTargetName = name;
    document.getElementById('resetModalName').textContent = `For ${name}. They'll need to use this exact password next time they sign in.`;
    document.getElementById('resetPasswordInput').value = '';
    document.getElementById('resetModalMsg').style.display = 'none';
    document.getElementById('resetOverlay').classList.add('show');
    document.getElementById('resetPasswordInput').focus();
  }

  function closeResetModal() {
    document.getElementById('resetOverlay').classList.remove('show');
    document.getElementById('resetPasswordInput').value = '';
    resetTargetId = null;
    resetTargetName = null;
  }

  document.getElementById('resetGenerateBtn').addEventListener('click', () => {
    document.getElementById('resetPasswordInput').value = generateTempPassword();
  });

  document.getElementById('resetModalCancel').addEventListener('click', closeResetModal);

  document.getElementById('resetModalConfirm').addEventListener('click', async () => {
    const modalMsg = document.getElementById('resetModalMsg');
    const confirmBtn = document.getElementById('resetModalConfirm');
    const newPassword = document.getElementById('resetPasswordInput').value;

    if (!newPassword || newPassword.length < 6) {
      modalMsg.textContent = 'Password must be at least 6 characters.';
      modalMsg.className = 'msg err';
      modalMsg.style.display = 'block';
      return;
    }

    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Saving…';

    try {
      const { data: { session } } = await sb.auth.getSession();

      const res = await fetch(`${SUPABASE_URL}/functions/v1/reset-attendant-password`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ user_id: resetTargetId, new_password: newPassword }),
      });
      const result = await res.json();

      if (!res.ok) {
        modalMsg.textContent = result.error || 'Could not reset password.';
        modalMsg.className = 'msg err';
        modalMsg.style.display = 'block';
        return;
      }

      await logActivityLocal('attendant_password_reset', { target_id: resetTargetId });

      modalMsg.textContent = `Password updated for ${resetTargetName}.`;
      modalMsg.className = 'msg ok';
      modalMsg.style.display = 'block';
      setTimeout(closeResetModal, 1400);
    } catch (err) {
      console.error('Reset password failed:', err);
      modalMsg.textContent = `Unexpected error: ${err.message || err}`;
      modalMsg.className = 'msg err';
      modalMsg.style.display = 'block';
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Set password';
    }
  });

  document.getElementById('inviteBtn').addEventListener('click', async () => {
    const msgEl = document.getElementById('inviteMsg');
    msgEl.className = 'msg';
    msgEl.style.display = 'none';

    const full_name = document.getElementById('newName').value.trim();
    const email = document.getElementById('newEmail').value.trim();
    const password = document.getElementById('newPassword').value;

    if (!full_name || !email || !password) {
      msgEl.textContent = 'Fill in all fields.';
      msgEl.className = 'msg err';
      return;
    }

    try {
      // Account creation must go through a server-side Edge Function —
      // it's the only place holding the privileged service_role key.
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(`${SUPABASE_URL}/functions/v1/create-attendant`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ full_name, email, password }),
      });
      const result = await res.json();

      if (!res.ok) {
        msgEl.textContent = result.error || 'Could not create account.';
        msgEl.className = 'msg err';
        return;
      }

      msgEl.textContent = `Account created for ${full_name}.`;
      msgEl.className = 'msg ok';
      document.getElementById('newName').value = '';
      document.getElementById('newEmail').value = '';
      document.getElementById('newPassword').value = '';
      loadUsers();
    } catch (err) {
      console.error('Create account failed:', err);
      msgEl.textContent = `Unexpected error: ${err.message || err}`;
      msgEl.className = 'msg err';
    }
  });

  (async function init() {
    try {
      if (typeof sb === 'undefined' || !sb.auth) {
        throw new Error("Connection to the server didn't load properly. Please refresh the page and try again.");
      }
      currentProfile = await requireAuth('admin');
      if (!currentProfile) return;
      loadUsers();
    } catch (err) {
      console.error('Init failed:', err);
      alert(err.message || 'Something went wrong loading this page.');
    }
  })();
</script>
</body>
</html>
