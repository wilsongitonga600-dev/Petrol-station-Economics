<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Reset Password — Shift Reconciliation</title>
<style>
  :root {
    --bg: #12151D; --panel: #1B1F29; --panel-dark: #0D0F15;
    --border: #2A2F3C; --input-bg: #1C2028; --input-border: #333A48;
    --text: #F2F0EB; --muted: #8B92A0; --placeholder: #5B616C;
    --shell-red: #ED1C24; --shell-yellow: #FDCC00; --green: #4FBE71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px;
  }
  .badge {
    width: 52px; height: 52px; border-radius: 14px; background: var(--shell-red);
    display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px;
  }
  h1 { text-align: center; font-size: 20px; margin: 0 0 4px; }
  p.subtitle { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 28px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  input[type="password"] {
    width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
    border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 14px; margin-bottom: 16px;
  }
  input::placeholder { color: var(--placeholder); }
  button {
    width: 100%; background: var(--shell-red); color: #fff; border: none;
    border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 14px rgba(237,28,36,0.35);
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    background: rgba(237,28,36,0.12); border: 1px solid rgba(237,28,36,0.4);
    color: #FF8A8F; font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none;
  }
  .success {
    background: rgba(79,190,113,0.12); border: 1px solid rgba(79,190,113,0.4);
    color: var(--green); font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none;
  }
  .status { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0; }
  .footnote { text-align: center; margin-top: 20px; }
  .footnote a { color: var(--muted); font-size: 12.5px; text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <div class="badge">⛽</div>
  <h1>Set New Password</h1>
  <p class="subtitle" id="subtitle">Verifying your reset link…</p>

  <div class="error" id="errorBox"></div>
  <div class="success" id="successBox"></div>

  <div class="status" id="verifyingStatus">One moment…</div>

  <form id="resetForm" style="display:none;">
    <label for="password">New password</label>
    <input type="password" id="password" placeholder="At least 6 characters" required autocomplete="new-password" />

    <label for="confirmPassword">Confirm new password</label>
    <input type="password" id="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password" />

    <button type="submit" id="submitBtn">Set new password</button>
  </form>

  <div class="footnote" id="invalidLinkFootnote" style="display:none;">
    <a href="forgot-password.html">Request a new reset link</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const subtitle = document.getElementById('subtitle');
  const verifyingStatus = document.getElementById('verifyingStatus');
  const resetForm = document.getElementById('resetForm');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const submitBtn = document.getElementById('submitBtn');
  const invalidLinkFootnote = document.getElementById('invalidLinkFootnote');

  let recoveryReady = false;

  function showInvalidLink() {
    if (recoveryReady) return;
    verifyingStatus.style.display = 'none';
    subtitle.textContent = 'This link is invalid or has expired.';
    errorBox.textContent = 'Please request a new password reset link and try again.';
    errorBox.style.display = 'block';
    invalidLinkFootnote.style.display = 'block';
  }

  // Supabase's client library automatically reads the recovery token out of
  // the URL when this page loads and fires a PASSWORD_RECOVERY event once
  // the temporary session is established.
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      recoveryReady = true;
      verifyingStatus.style.display = 'none';
      subtitle.textContent = 'Choose a new password for your account';
      resetForm.style.display = 'block';
    }
  });

  // Fallback: if a session already exists with no recovery event (e.g. the
  // event fired before this listener attached), allow the form anyway.
  // Otherwise, if nothing happens within a few seconds, the link is bad.
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session && !recoveryReady) {
      recoveryReady = true;
      verifyingStatus.style.display = 'none';
      subtitle.textContent = 'Choose a new password for your account';
      resetForm.style.display = 'block';
    }
  })();

  setTimeout(() => {
    if (!recoveryReady) showInvalidLink();
  }, 4000);

  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password.length < 6) {
      errorBox.textContent = 'Password must be at least 6 characters.';
      errorBox.style.display = 'block';
      return;
    }
    if (password !== confirmPassword) {
      errorBox.textContent = 'Passwords do not match.';
      errorBox.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';

    const { error } = await supabase.auth.updateUser({ password });

    if (error) {
      errorBox.textContent = error.message;
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Set new password';
      return;
    }

    resetForm.style.display = 'none';
    successBox.textContent = 'Password updated. Redirecting to sign in…';
    successBox.style.display = 'block';

    // Sign out of the temporary recovery session so the person logs back in
    // fresh with their new password, rather than being left in this state.
    await supabase.auth.signOut();
    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
  });
</script>
</body>
</html>
