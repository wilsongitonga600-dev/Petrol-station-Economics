<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Forgot Password — Shift Reconciliation</title>
<style>
  :root {
    --bg: #12151D; --panel: #1B1F29; --panel-dark: #0D0F15;
    --border: #2A2F3C; --input-bg: #1C2028; --input-border: #333A48;
    --text: #F2F0EB; --muted: #8B92A0; --placeholder: #5B616C;
    --shell-red: #ED1C24; --shell-yellow: #FDCC00; --green: #4FBE71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px;
  }
  .badge {
    width: 52px; height: 52px; border-radius: 14px; background: var(--shell-red);
    display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px;
  }
  h1 { text-align: center; font-size: 20px; margin: 0 0 4px; }
  p.subtitle { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 28px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  input[type="email"] {
    width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
    border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 14px; margin-bottom: 16px;
  }
  input::placeholder { color: var(--placeholder); }
  button {
    width: 100%; background: var(--shell-red); color: #fff; border: none;
    border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 14px rgba(237,28,36,0.35);
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    background: rgba(237,28,36,0.12); border: 1px solid rgba(237,28,36,0.4);
    color: #FF8A8F; font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none;
    word-break: break-word;
  }
  .success {
    background: rgba(79,190,113,0.12); border: 1px solid rgba(79,190,113,0.4);
    color: var(--green); font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none;
  }
  .footnote { text-align: center; margin-top: 20px; }
  .footnote a { color: var(--muted); font-size: 12.5px; text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <div class="badge">⛽</div>
  <h1>Forgot Password</h1>
  <p class="subtitle">Enter your email and we'll send you a reset link</p>

  <div class="error" id="errorBox"></div>
  <div class="success" id="successBox"></div>

  <form id="forgotForm">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@station.com" required autocomplete="username" />

    <button type="submit" id="submitBtn">Send reset link</button>
  </form>

  <p class="footnote"><a href="index.html">← Back to sign in</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=2"></script>
<script>
  const form = document.getElementById('forgotForm');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const submitBtn = document.getElementById('submitBtn');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
  }

  // Build the redirect URL from the current page's own location, so this
  // works correctly whether the app is hosted at a root domain or under a
  // GitHub Pages project subpath (e.g. /Petrol-station-Economics/shift-app/).
  function resetPasswordUrl() {
    return window.location.origin + window.location.pathname.replace('forgot-password.html', 'reset-password.html');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    successBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    try {
      if (typeof sb === 'undefined' || !sb.auth) {
        throw new Error("Connection to the server didn't load properly. Please refresh the page and try again.");
      }

      const email = document.getElementById('email').value.trim();

      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: resetPasswordUrl(),
      });

      // Rate limiting is the one case worth surfacing distinctly. For every
      // other outcome we show the same generic message whether or not the
      // email exists, so this page never reveals which emails have accounts.
      if (error && error.message.toLowerCase().includes('rate limit')) {
        showError('Too many attempts. Please wait a few minutes and try again.');
        return;
      }

      successBox.textContent = 'If an account exists for that email, a reset link has been sent. Check your inbox.';
      successBox.style.display = 'block';
      form.reset();

    } catch (err) {
      console.error('Reset request failed:', err);
      showError(`Unexpected error: ${err.message || err}`);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send reset link';
    }
  });
</script>
</body>
</html>
